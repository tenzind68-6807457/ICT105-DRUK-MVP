<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Details</title><link rel="stylesheet" href="assets/css/style.css"></head><body><div data-header></div><main class="section-sm"><div class="container" id="detailsRoot"></div></main><div data-footer></div><script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script>
function loadDetails(){
 const id=Number(new URLSearchParams(location.search).get('id')); const event=getData('sceh_events').find(e=>e.id===id); const root=document.getElementById('detailsRoot');
 if(!event){root.innerHTML='<div class="empty-state">Event not found.</div>';return;}
 const user=currentUser(), regs=getData('sceh_registrations'), existing=user&&regs.find(r=>r.eventId===id&&r.userId===user.id&&r.status!=='Cancelled'); const count=regs.filter(r=>r.eventId===id&&r.status!=='Cancelled').length; const ended=isEnded(event); const reviews=getData('sceh_reviews').filter(r=>r.eventId===id&&r.status==='Approved');
 root.innerHTML=`<div class="details-layout"><article class="details-main"><div class="details-cover"><img src="${event.image}" alt="${escapeHtml(event.title)}"></div><div class="details-content"><span class="badge badge-open">${escapeHtml(event.category)}</span><h1>${escapeHtml(event.title)}</h1><p>${escapeHtml(event.description)}</p><h2>About this event</h2><p>This event is organized for university students. Please arrive on time and bring your student identification when required.</p><h2>Student Reviews</h2><div id="reviewsList">${reviews.length?reviews.map(r=>`<div class="review-card"><strong>${escapeHtml(r.userName)}</strong><div class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div><p>${escapeHtml(r.comment)}</p></div>`).join(''):'<p class="section-subtitle">No approved reviews yet.</p>'}</div>${ended?'<div id="reviewFormWrap"></div>':''}</div></article><aside class="details-side"><h3>Event Information</h3><div class="detail-list"><div class="detail-item"><small>Date</small><strong>${formatDate(event.date)}</strong></div><div class="detail-item"><small>Time</small><strong>${escapeHtml(event.time)}</strong></div><div class="detail-item"><small>Location</small><strong>${escapeHtml(event.location)}</strong></div><div class="detail-item"><small>Organizer</small><strong>${escapeHtml(event.organizer)}</strong></div><div class="detail-item"><small>Registration</small><strong>${count}/${event.capacity} students</strong></div></div><button class="btn btn-primary btn-block" id="registerBtn" ${ended||count>=event.capacity?'disabled':''}>${ended?'Event Ended':existing?'Cancel Registration':count>=event.capacity?'Event Full':'Register for Event'}</button></aside></div>`;
 const btn=document.getElementById('registerBtn'); if(btn&&!ended&&count<event.capacity) btn.onclick=()=>{const u=requireStudent(location.href);if(!u)return;let all=getData('sceh_registrations');const found=all.find(r=>r.eventId===id&&r.userId===u.id&&r.status!=='Cancelled');if(found){found.status='Cancelled';found.updatedAt=new Date().toISOString();toast('Registration cancelled.');}else{all.push({id:Date.now(),eventId:id,userId:u.id,userName:u.name,email:u.email,status:'Registered',registeredAt:new Date().toISOString()});toast('Registration successful.');}setData('sceh_registrations',all);setTimeout(loadDetails,500);};
 if(ended){const wrap=document.getElementById('reviewFormWrap');if(user){const attended=regs.some(r=>r.eventId===id&&r.userId===user.id&&r.status!=='Cancelled');const already=getData('sceh_reviews').some(r=>r.eventId===id&&r.userId===user.id);wrap.innerHTML=attended&&!already?`<div class="panel" style="margin-top:24px"><h3>Write a Review</h3><form id="reviewForm"><div class="form-group"><label>Rating</label><select id="rating" required><option value="">Choose rating</option><option value="5">5 - Excellent</option><option value="4">4 - Very Good</option><option value="3">3 - Good</option><option value="2">2 - Fair</option><option value="1">1 - Poor</option></select></div><div class="form-group"><label>Comment</label><textarea id="comment" required placeholder="Share your experience..."></textarea></div><button class="btn btn-primary">Submit Review</button></form></div>`:already?'<p class="section-subtitle" style="margin-top:20px">You already submitted a review.</p>':'<p class="section-subtitle" style="margin-top:20px">Only registered attendees can review this event.</p>';const form=document.getElementById('reviewForm');if(form)form.onsubmit=e=>{e.preventDefault();const list=getData('sceh_reviews');list.push({id:Date.now(),eventId:id,userId:user.id,userName:user.name,rating:Number(rating.value),comment:comment.value.trim(),createdAt:new Date().toISOString(),status:'Pending'});setData('sceh_reviews',list);toast('Review submitted for admin approval.');setTimeout(loadDetails,600);};}else{wrap.innerHTML='<p class="section-subtitle" style="margin-top:20px"><a href="login.html">Login</a> to review this event.</p>';}}
}
document.addEventListener('DOMContentLoaded',loadDetails);
</script></body></html>
