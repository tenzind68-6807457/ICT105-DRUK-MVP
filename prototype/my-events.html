<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Events</title><link rel="stylesheet" href="assets/css/style.css"></head><body><div data-header></div><main><section class="page-hero"><div class="container"><h1>My Events</h1><p>Manage upcoming registrations and review events you attended.</p></div></section><section class="section-sm"><div class="container"><div class="my-events-tabs"><button class="btn btn-primary" data-tab="upcoming">Upcoming</button><button class="btn btn-secondary" data-tab="completed">Completed & Reviews</button></div><div id="myEventGrid" class="event-grid"></div></div></section></main><div data-footer></div><script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script>
document.addEventListener('DOMContentLoaded',()=>{const u=currentUser();if(!u){location.href='login.html';return;}let active='upcoming';const render=()=>{const regs=getData('sceh_registrations').filter(r=>r.userId===u.id&&r.status!=='Cancelled');const ids=regs.map(r=>r.eventId);const reviews=getData('sceh_reviews');let events=getData('sceh_events').filter(e=>ids.includes(e.id));events=events.filter(e=>active==='completed'?isEnded(e):!isEnded(e));myEventGrid.innerHTML=events.length?events.map(e=>{const reviewed=reviews.some(r=>r.eventId===e.id&&r.userId===u.id);return `<article class="event-card"><div class="event-img"><img src="${e.image}" alt="${escapeHtml(e.title)}"><span class="badge badge-category">${escapeHtml(e.category)}</span></div><div class="event-body"><h3>${escapeHtml(e.title)}</h3><div class="event-meta"><span>📅 ${formatDate(e.date)} · ${escapeHtml(e.time)}</span><span>📍 ${escapeHtml(e.location)}</span></div></div><div class="event-footer"><span class="badge ${isEnded(e)?'badge-closed':'badge-open'}">${isEnded(e)?(reviewed?'Review Submitted':'Ready for Review'):'Registered'}</span><a class="btn btn-primary btn-sm" href="event-details.html?id=${e.id}${isEnded(e)?'#write-review':''}">${isEnded(e)?(reviewed?'View Review Status':'Give Review'):'View Details'}</a></div></article>`}).join(''):`<div class="empty-state">${active==='completed'?'You do not have any completed registered events yet.':'You have no upcoming registered events.'}</div>`;};document.querySelectorAll('[data-tab]').forEach(btn=>btn.onclick=()=>{active=btn.dataset.tab;document.querySelectorAll('[data-tab]').forEach(b=>{b.className='btn '+(b===btn?'btn-primary':'btn-secondary')});render();});render();});
</script></body></html>
