<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSU Student Sign Up</title><link rel="stylesheet" href="assets/css/style.css"></head><body><div data-header></div><main class="auth-wrap"><div class="auth-card auth-card-wide"><h1>Create RSU student account</h1><p>Only current RSU students can create an account and register for events.</p><div id="alert" class="alert alert-error"></div><form id="signupForm"><div class="form-row"><div class="form-group"><label>Full name</label><input class="input" id="name" required></div><div class="form-group"><label>Student ID</label><input class="input" id="studentId" required placeholder="Example: 6501234"></div></div><div class="form-row"><div class="form-group"><label>Major</label><input class="input" id="major" required placeholder="Example: Information Technology"></div><div class="form-group"><label>RSU email</label><input class="input" id="email" type="email" required placeholder="name@rsu.ac.th"></div></div><div class="form-row"><div class="form-group"><label>Password</label><input class="input" id="password" type="password" minlength="6" required></div><div class="form-group"><label>Confirm password</label><input class="input" id="confirmPassword" type="password" required></div></div><button class="btn btn-primary btn-block">Create Account</button></form><p class="form-note">Already registered? <a href="login.html" style="color:var(--primary);font-weight:700">Login</a></p></div></main><script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script>
signupForm.onsubmit=e=>{e.preventDefault();const users=getData('sceh_users');const cleanEmail=email.value.trim().toLowerCase();const cleanStudentId=studentId.value.trim();alert.classList.remove('show');if(password.value!==confirmPassword.value){alert.textContent='Passwords do not match.';alert.classList.add('show');return;}if(users.some(u=>u.email.toLowerCase()===cleanEmail)){alert.textContent='An account already exists with this email.';alert.classList.add('show');return;}if(users.some(u=>u.studentId===cleanStudentId)){alert.textContent='This student ID is already registered.';alert.classList.add('show');return;}const user={id:Date.now(),name:name.value.trim(),studentId:cleanStudentId,major:major.value.trim(),email:cleanEmail,password:password.value,role:'student',joinedAt:new Date().toISOString()};users.push(user);setData('sceh_users',users);const session={...user};delete session.password;localStorage.setItem('sceh_currentUser',JSON.stringify(session));location.href=localStorage.getItem('sceh_returnUrl')||'index.html';};
</script></body></html>
