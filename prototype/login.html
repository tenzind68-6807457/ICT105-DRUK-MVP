<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="assets/css/style.css"></head><body><div data-header></div><main class="auth-wrap"><div class="auth-card"><h1>Welcome back</h1><p>Login to register for events and manage your activity.</p><div id="alert" class="alert alert-error"></div><form id="loginForm"><div class="form-group"><label>Email</label><input class="input" id="email" type="email" required></div><div class="form-group"><label>Password</label><input class="input" id="password" type="password" required></div><button class="btn btn-primary btn-block">Login</button></form><p class="form-note">Demo student: student@campus.edu / student123<br>Demo admin: admin@campus.edu / admin123</p><p class="form-note">No account? <a href="signup.html" style="color:var(--primary);font-weight:700">Sign up</a></p></div></main><script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script>loginForm.onsubmit=e=>{e.preventDefault();const user=getData('sceh_users').find(u=>u.email.toLowerCase()===email.value.trim().toLowerCase()&&u.password===password.value);if(!user){alert.textContent='Incorrect email or password.';alert.classList.add('show');return;}localStorage.setItem('sceh_currentUser',JSON.stringify({...user,password:undefined}));const redirect=localStorage.getItem('sceh_returnUrl');localStorage.removeItem('sceh_returnUrl');location.href=redirect||(user.role==='admin'?'admin.html':'index.html');};</script></body></html>
