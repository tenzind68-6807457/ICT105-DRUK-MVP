<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact</title><link rel="stylesheet" href="assets/css/style.css"></head><body><div data-header></div><main><section class="page-hero"><div class="container"><h1>Contact Us</h1><p>Questions about an event or the platform? Send us a message.</p></div></section><section class="section"><div class="container contact-grid"><div class="panel"><h2>Event Hub Office</h2><p>Student Affairs Building, Room 204</p><p>📧 events@campus.edu</p><p>☎️ +66 2 000 0000</p><p>Monday–Friday, 9:00 AM–5:00 PM</p></div><div class="panel"><form id="contactForm"><div class="form-row"><div class="form-group"><label>Name</label><input class="input" required></div><div class="form-group"><label>Email</label><input class="input" type="email" required></div></div><div class="form-group"><label>Subject</label><input class="input" required></div><div class="form-group"><label>Message</label><textarea required></textarea></div><button class="btn btn-primary">Send Message</button></form></div></div></section></main><div data-footer></div><script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script>contactForm.onsubmit=e=>{e.preventDefault();toast('Message sent successfully.');contactForm.reset();};</script></body></html>
